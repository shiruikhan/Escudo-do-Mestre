<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conectando ao Spotify — Escudo do Mestre</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#111214" />
  <link rel="stylesheet" href="assets/css/tailwind.css" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body class="min-h-screen flex items-center justify-center px-4">

  <main class="vazio !mt-0 max-w-sm w-full">
    <img src="assets/favicon.svg" alt="" width="48" height="48" class="mx-auto mb-4" />
    <h1 class="titulo-entidade">Trilha sonora</h1>
    <p id="cb-msg" class="subtitulo-entidade mt-2" role="status" aria-live="polite">Concluindo a conexão com o Spotify…</p>
    <div id="cb-carregando" class="spinner mt-6" aria-hidden="true"></div>
    <!-- .btn define display: a ocultação fica no invólucro -->
    <div id="cb-voltar" class="mt-6 hidden">
      <a href="index.html" class="btn btn-primario btn-largo">Voltar ao Escudo</a>
    </div>
  </main>

  <script src="assets/js/spotify.js"></script>
  <script>
    (function () {
      'use strict';
      const msg = document.getElementById('cb-msg');
      const carregando = document.getElementById('cb-carregando');
      const voltar = document.getElementById('cb-voltar');

      function falhar(texto) {
        carregando.remove();
        msg.textContent = texto;
        voltar.classList.remove('hidden');
      }

      const p = new URLSearchParams(location.search);
      const erro = p.get('error');
      const code = p.get('code');
      const estado = p.get('state');

      // O usuário pode ter recusado a autorização na tela do Spotify.
      if (erro) {
        falhar(erro === 'access_denied'
          ? 'Autorização cancelada. A trilha sonora continua desativada.'
          : 'O Spotify recusou a autorização: ' + erro);
        return;
      }
      if (!code) {
        falhar('Nenhum código de autorização recebido.');
        return;
      }

      window.SpotifyAPI.concluirLogin(code, estado)
        .then(function (retorno) {
          msg.textContent = 'Conectado! Voltando…';
          location.replace(retorno);
        })
        .catch(function (e) {
          falhar(e.message || 'Não foi possível concluir a conexão.');
        });
    })();
  </script>
</body>
</html>
