# Escudo do Mestre — CI
#
# Roda em todo push/PR na main:
#   1. validar-dados — sintaxe dos JSONs, marcadores de drill-down e cobertura do sw.js
#   2. check-sw — garante que CORE_ASSETS do sw.js está sincronizado com o projeto
#      (se falhar, rode localmente: npm run gerar-sw)

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validar dados (JSON + marcadores + sw.js)
        run: npm run validar-dados

      - name: Conferir CORE_ASSETS do sw.js
        run: npm run check-sw
