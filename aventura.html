<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aventura — Escudo do Mestre</title>
  <meta name="description" content="Consulte bestiário, NPCs, itens, ganchos e missões da aventura selecionada — painel do narrador para D&amp;D 5.5e." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="alternate icon" href="assets/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#111214" />
  <link rel="stylesheet" href="assets/css/tailwind.css" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body class="com-nav min-h-screen flex flex-col">

  <!-- Cabeçalho fixo: início/voltar, título, anotações e busca -->
  <header class="cabecalho sticky top-0 z-20 px-2 pt-1 pb-3">
    <div class="cabecalho-linha">
      <a href="index.html" id="btn-inicio" class="icone-btn" title="Início" aria-label="Início"></a>
      <button type="button" id="btn-voltar" class="icone-btn ouro hidden" title="Voltar" aria-label="Voltar"></button>
      <div class="cabecalho-titulo">
        <h1 id="titulo-aventura">Carregando…</h1>
        <p id="sub-aventura"></p>
      </div>
      <button type="button" id="btn-notas" class="icone-btn hidden"
              title="Anotações do Mestre" aria-label="Anotações do Mestre"></button>
    </div>
    <!-- Busca geral -->
    <label class="busca mx-2 mt-1">
      <span id="icone-busca"></span>
      <input id="busca" type="search" inputmode="search" autocomplete="off"
             placeholder="Pesquisar monstros, NPCs, itens, locais…"
             class="busca-input" aria-label="Pesquisa geral" />
    </label>
  </header>

  <!-- Conteúdo principal -->
  <main id="conteudo" class="flex-1 px-4 pt-4 pb-8" aria-live="polite" aria-atomic="false"></main>

  <!-- Navegação inferior (montada pelo app.js) -->
  <nav id="tabs" class="nav-inferior" aria-label="Seções da aventura"></nav>

  <!-- Ordem importa: utils expõe window.escHtml; renderers-core monta window.Renderers
       e os helpers internos; os módulos de domínio se registram em window.Renderers;
       renderers-busca fecha a API pública (índice/busca/export); app orquestra. -->
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/marcadores.js"></script>
  <script src="assets/js/renderers-core.js"></script>
  <script src="assets/js/renderers-bestiario.js"></script>
  <script src="assets/js/renderers-npcs-itens.js"></script>
  <script src="assets/js/renderers-ganchos-missoes.js"></script>
  <script src="assets/js/renderers-locais.js"></script>
  <script src="assets/js/renderers-livro.js"></script>
  <script src="assets/js/renderers-condicoes-eventos.js"></script>
  <script src="assets/js/renderers-combate.js"></script>
  <script src="assets/js/renderers-busca.js"></script>
  <script src="assets/js/spotify.js"></script>
  <script src="assets/js/trilha.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
