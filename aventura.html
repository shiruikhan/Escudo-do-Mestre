<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aventura — Escudo do Mestre</title>
  <meta name="description" content="Consulte bestiário, NPCs, itens, ganchos e missões da aventura selecionada — painel do narrador para D&amp;D 5.5e." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="alternate icon" href="assets/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#09090b" />
  <link rel="stylesheet" href="assets/css/tailwind.css" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col">

  <!-- Header fixo -->
  <header class="sticky top-0 z-20 bg-zinc-950/95 backdrop-blur border-b border-zinc-800">
    <div class="px-4 pt-3 pb-2">
      <div class="flex items-center gap-3">
        <a href="index.html" class="text-zinc-400 text-xl flex-shrink-0 active:text-amber-400" aria-label="Início">&#8962;</a>
        <button type="button" id="btn-voltar"
                class="hidden text-amber-400 text-sm font-semibold flex-shrink-0 active:text-amber-300">
          &lsaquo; Voltar
        </button>
        <div class="flex-1 min-w-0 text-right">
          <h1 id="titulo-aventura" class="text-base font-bold text-amber-400 truncate">Carregando…</h1>
          <p id="sub-aventura" class="text-xs text-zinc-500 truncate"></p>
        </div>
        <button type="button" id="btn-notas"
                class="hidden text-zinc-500 text-lg flex-shrink-0 active:text-amber-400"
                title="Anotações do Mestre" aria-label="Anotações do Mestre">&#128221;</button>
        <button type="button" id="btn-exportar"
                class="hidden text-zinc-500 text-lg flex-shrink-0 active:text-amber-400"
                title="Exportar como Markdown" aria-label="Exportar como Markdown">⬇</button>
        <button type="button" id="btn-tema"
                class="text-zinc-500 text-lg flex-shrink-0 active:text-amber-400"
                title="Alternar tema" aria-label="Alternar tema claro/escuro">&#127769;</button>
      </div>
    </div>
    <!-- Busca geral -->
    <div class="px-4 pb-2">
      <input id="busca" type="search" inputmode="search" autocomplete="off"
             placeholder="Pesquisar monstros, NPCs, itens, locais…"
             class="busca-input" aria-label="Pesquisa geral" />
    </div>
    <!-- Barra de abas com indicador de scroll -->
    <div class="relative">
      <nav id="tabs" class="tabs-bar px-4 pb-3"></nav>
      <div class="tabs-fade-right" aria-hidden="true"></div>
    </div>
  </header>

  <!-- Conteúdo principal -->
  <main id="conteudo" class="flex-1 px-4 py-4" aria-live="polite" aria-atomic="false"></main>

  <footer class="pb-6 pt-2"></footer>

  <!-- Ordem importa: utils expõe window.escHtml; renderers-core monta window.Renderers
       e os helpers internos; os módulos de domínio se registram em window.Renderers;
       renderers-busca fecha a API pública (índice/busca/export); app orquestra. -->
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/marcadores.js"></script>
  <script src="assets/js/renderers-core.js"></script>
  <script src="assets/js/renderers-bestiario.js"></script>
  <script src="assets/js/renderers-npcs-itens.js"></script>
  <script src="assets/js/renderers-ganchos-missoes.js"></script>
  <script src="assets/js/renderers-locais.js"></script>
  <script src="assets/js/renderers-condicoes-eventos.js"></script>
  <script src="assets/js/renderers-combate.js"></script>
  <script src="assets/js/renderers-busca.js"></script>
  <script src="assets/js/spotify.js"></script>
  <script src="assets/js/trilha.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
