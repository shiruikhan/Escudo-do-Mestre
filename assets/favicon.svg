<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Escudo do Mestre">
  <defs>
    <linearGradient id="ouro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="0.55" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <!-- Fundo arredondado escuro (tema do app) -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#09090b"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="#27272a" stroke-width="1.5"/>
  <!-- Escudo -->
  <path d="M32 8 L53 14.5 L53 32 Q53 47 32 57 Q11 47 11 32 L11 14.5 Z"
        fill="url(#ouro)" stroke="#7c3a05" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Recorte heráldico interno -->
  <path d="M32 8 L53 14.5 L53 32 Q53 47 32 57 Q11 47 11 32 L11 14.5 Z"
        fill="none" stroke="#09090b" stroke-width="1.2" stroke-linejoin="round" opacity="0.35"
        transform="translate(32 32) scale(0.82) translate(-32 -32)"/>
  <!-- Divisão vertical + chefe (faixa superior) sugerindo brasão -->
  <line x1="32" y1="11" x2="32" y2="55" stroke="#09090b" stroke-width="1.6" opacity="0.35"/>
  <line x1="13" y1="24" x2="51" y2="24" stroke="#09090b" stroke-width="1.6" opacity="0.35"/>
  <!-- Boss central -->
  <circle cx="32" cy="24" r="3" fill="#09090b" opacity="0.5"/>
</svg>
