<body class="min-h-screen flex flex-col">

                 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13
                 -.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66

    <div class="marca">
      <img src="assets/favicon.svg" alt="" width="48" height="48" />
      <h1>Escudo do Mestre</h1>
      <p>D&amp;D 5.5e · Painel do Narrador</p>
    </div>
  </header>

  <!-- Main -->
  <main class="flex-1 px-4 pb-8">

    <!-- Busca global: procura monstros, NPCs, itens e locais em TODAS as
         aventuras. Os dados são carregados sob demanda na primeira digitação
         e os resultados usam deep-link (aventura.html?id=x#tipo/id). -->
    <label class="busca mb-6 mt-5">
      <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
      <input id="busca-global" type="search" inputmode="search" autocomplete="off"
             placeholder="Buscar em todas as aventuras…"
             class="busca-input" aria-label="Busca global" />
    </label>
    <div id="resultados-globais"></div>

    <h2 id="titulo-lista" class="rotulo-secao mb-2">Aventuras</h2>

    <!-- Adventure list — populated by JS -->
    <ul id="adventure-list" class="space-y-3"></ul>

    <!-- Empty state (shown while loading or if no adventures found) -->
    <div id="empty-state" class="hidden vazio">
      <p id="empty-state-msg">Nenhuma aventura encontrada.</p>
      <p class="ajuda mt-1">Adicione arquivos JSON em <code>data/aventuras/</code>.</p>
    </div>

  </main>

  <!-- Footer: backup do estado de sessão (status de missões, PV, combate,
       anotações — tudo em localStorage, que não sobrevive à troca de aparelho) -->
  <footer class="pb-6 px-4 text-center">
    <p class="ajuda flex justify-center gap-2 items-center">
      <button type="button" id="btn-backup" class="min-h-[44px] px-2 underline underline-offset-4 active:text-amber-400">Exportar sessão</button>
      ·
      <button type="button" id="btn-restaurar" class="min-h-[44px] px-2 underline underline-offset-4 active:text-amber-400">Importar sessão</button>
    </p>
    <input type="file" id="arquivo-restaurar" accept="application/json,.json" class="hidden" />
  </footer>

  <script>
    // Carrega o manifest em data/aventuras.json
    async function loadManifest() {
      const res = await fetch('data/aventuras.json');
      if (!res.ok) throw new Error('Manifest não encontrado');
      return res.json();
    }

    function renderAdventures(list) {
      const ul = document.getElementById('adventure-list');
      const empty = document.getElementById('empty-state');

      if (!list.length) {
        empty.classList.remove('hidden');
        return;
      }

      ul.innerHTML = list.map(adv => `
        <li>
          <a href="aventura.html?id=${encodeURIComponent(adv.id)}" class="aventura-card">
            ${adv.cenario ? `<span class="rotulo-secao">${escHtml(adv.cenario)}</span>` : ''}
            <h2>${escHtml(adv.titulo)}</h2>
            ${adv.descricao ? `<p class="aventura-desc">${escHtml(adv.descricao)}</p>` : ''}
            ${adv.nivel_recomendado || adv.num_jogadores ? `
            <div class="aventura-dados">
              ${adv.nivel_recomendado ? `<div><b>${escHtml(adv.nivel_recomendado)}</b><span class="rotulo-secao">Níveis</span></div>` : ''}
              ${adv.num_jogadores ? `<div><b>${escHtml(adv.num_jogadores)}</b><span class="rotulo-secao">Jogadores</span></div>` : ''}
            </div>` : ''}
          </a>
        </li>
      `).join('');
    }

    // ---------- Busca global entre aventuras ----------
    // Indexa apenas seções com chaves estáveis no JSON (bestiário, NPCs,
    // itens e locais); missões/ganchos ficam na busca interna da aventura.
    let indiceGlobal = null;
    let carregandoIndice = null;

    async function montarIndiceGlobal() {
      const manifest = await loadManifest();
      const TIPOS = { bestiario: 'Monstro', npcs: 'NPC', itens: 'Item', locais: 'Local' };
      const idx = [];
      await Promise.all(manifest.map(async meta => {
        try {
          const av = await fetch('data/aventuras/' + meta.arquivo).then(r => r.json());
          for (const [secao, label] of Object.entries(TIPOS)) {
            for (const [id, obj] of Object.entries(av[secao] || {})) {
              idx.push({ av: meta.id, avTitulo: meta.titulo, secao, label, id,
                         nome: obj.nome || id, chave: normalizarBusca(obj.nome || id) });
            }
          }
        } catch (_) { /* aventura inacessível — segue com as demais */ }
      }));
      return idx;
    }

    function normalizarBusca(s) {
      return String(s == null ? '' : s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    }

    function renderResultadosGlobais(res, q) {
      const alvo = document.getElementById('resultados-globais');
      const titulo = document.getElementById('titulo-lista');
      const lista = document.getElementById('adventure-list');
      const mostrando = q.length > 0;
      titulo.classList.toggle('hidden', mostrando);
      lista.classList.toggle('hidden', mostrando);
      if (!mostrando) { alvo.innerHTML = ''; return; }
      if (!res.length) {
        alvo.innerHTML = '<p class="text-sm text-zinc-600 text-center my-8">Nada encontrado.</p>';
        return;
      }
      alvo.innerHTML = '<ul class="lista-verbetes mb-6">' + res.slice(0, 30).map(e => `
        <li>
          <a href="aventura.html?id=${encodeURIComponent(e.av)}#${encodeURIComponent(e.secao)}/${encodeURIComponent(e.id)}"
             class="verbete">
            <span class="verbete-corpo">
              <span class="flex items-center gap-2 min-w-0">
                <span class="verbete-nome">${escHtml(e.nome)}</span>
                <span class="res-tag">${escHtml(e.label)}</span>
              </span>
              <span class="verbete-sub">${escHtml(e.avTitulo)}</span>
            </span>
            <span class="verbete-seta" aria-hidden="true"></span>
          </a>
        </li>`).join('') + '</ul>';
    }

    (function initBuscaGlobal() {
      const campo = document.getElementById('busca-global');
      if (!campo) return;
      let t = null;
      campo.addEventListener('input', () => {
        clearTimeout(t);
        t = setTimeout(async () => {
          const q = normalizarBusca(campo.value.trim());
          if (!q) { renderResultadosGlobais([], ''); return; }
          if (!indiceGlobal) {
            document.getElementById('resultados-globais').innerHTML =
              '<p class="text-sm text-zinc-600 text-center my-8">Carregando dados das aventuras…</p>';
            carregandoIndice = carregandoIndice || montarIndiceGlobal();
            indiceGlobal = await carregandoIndice;
          }
          renderResultadosGlobais(indiceGlobal.filter(e => e.chave.includes(q)), q);
        }, 200);
      });
    })();

    // ---------- Backup / restauração do estado de sessão ----------
    (function initBackup() {
      const btnB = document.getElementById('btn-backup');
      const btnR = document.getElementById('btn-restaurar');
      const arq = document.getElementById('arquivo-restaurar');
      if (!btnB || !btnR || !arq) return;

      btnB.addEventListener('click', () => {
        const dados = {};
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          // Credenciais do Spotify vivem sob sptfy_ justamente para ficarem
          // fora deste varredor; a checagem explícita é defesa em profundidade
          // caso alguma chave seja renomeada no futuro.
          if (k && k.startsWith('escudo_') && !k.startsWith('sptfy_')) {
            dados[k] = localStorage.getItem(k);
          }
        }
        if (!Object.keys(dados).length) {
          if (window.mostrarToast) window.mostrarToast('Nenhum dado de sessão para exportar.');
          return;
        }
        const blob = new Blob([JSON.stringify(dados, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'escudo-sessao-' + new Date().toISOString().slice(0, 10) + '.json';
        a.click();
        URL.revokeObjectURL(url);
      });

      btnR.addEventListener('click', () => arq.click());
      arq.addEventListener('change', () => {
        const f = arq.files && arq.files[0];
        if (!f) return;
        const leitor = new FileReader();
        leitor.onload = () => {
          try {
            const dados = JSON.parse(leitor.result);
            const chaves = Object.keys(dados).filter(k => k.startsWith('escudo_'));
            if (!chaves.length) throw new Error('sem chaves');
            if (!window.confirm('Importar ' + chaves.length + ' registro(s) de sessão? Dados atuais com a mesma chave serão sobrescritos.')) return;
            for (const k of chaves) localStorage.setItem(k, String(dados[k]));
            if (window.mostrarToast) window.mostrarToast('Sessão restaurada: ' + chaves.length + ' registro(s).');
          } catch (_) {
            if (window.mostrarToast) window.mostrarToast('Arquivo inválido — use um backup exportado pelo Escudo do Mestre.');
          }
          arq.value = '';
        };
        leitor.readAsText(f);
      });
    })();

    loadManifest().then(renderAdventures).catch(() => {
      // Sem o manifest a lista fica vazia para sempre — mostra o empty state
      // com uma mensagem de erro em vez de deixar a tela em branco.
      document.getElementById('empty-state-msg').textContent =
        'Não foi possível carregar as aventuras. Verifique sua conexão e recarregue a página.';
      document.getElementById('empty-state').classList.remove('hidden');
    });
  </script>

</body>
